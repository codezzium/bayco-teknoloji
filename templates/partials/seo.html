{% load static %}
{% comment %}Yeniden kullanılabilir SEO başlık bloğu. title / description ile çağrılır.{% endcomment %}
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<meta name="keywords" content="{{ keywords|default:'Eskişehir telefon, Eskişehir ikinci el telefon, Eskişehir sıfır telefon, telefon takas Eskişehir, telefon tamiri Eskişehir, teknik servis Eskişehir, Bayço Teknoloji' }}">
<link rel="canonical" href="{{ request.build_absolute_uri }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="{{ site.brand_name }}">
<meta name="geo.region" content="TR-26">
<meta name="geo.placename" content="Eskişehir">

<!-- Open Graph -->
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:site_name" content="Eskişehir {{ site.brand_name }}">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
<meta property="og:image" content="{% if og_image %}{{ request.scheme }}://{{ request.get_host }}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}{% endif %}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{% if og_image %}{{ request.scheme }}://{{ request.get_host }}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}{% endif %}">
