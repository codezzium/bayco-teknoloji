{% load stock_extras %}
<div id="accessory-{{ accessory.pk }}" class="card p-4 flex flex-col sm:flex-row sm:items-center gap-3">
  <label class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer">
    <input type="checkbox" name="acc" value="{{ accessory.pk }}" form="lblform"
           class="toggle-check shrink-0">
    <div class="min-w-0">
      <a href="{% url 'stock:accessory_detail' pk=accessory.pk %}"
         class="font-semibold hover:underline block truncate">{{ accessory }}</a>
      <div class="text-xs flex flex-wrap gap-x-3 gap-y-1 mt-1" style="color:var(--muted)">
        {% if accessory.brand %}<span>{{ accessory.brand.name }}</span>{% endif %}
        {% if accessory.category %}<span>{{ accessory.category.name }}</span>{% endif %}
        <span class="font-mono">{{ accessory.barcode|default:accessory.sku }}</span>
        {% if not accessory.is_active %}<span style="color:#ff8b95">Pasif</span>{% endif %}
      </div>
    </div>
  </label>

  <div class="flex items-center justify-between sm:justify-end gap-4 shrink-0">
    <div class="text-center">
      <div class="text-lg font-display font-extrabold
                  {% if accessory.stock_qty < 0 %}text-red-400{% endif %}"
           {% if accessory.stock_qty < 0 %}style="color:#ff8b95"
           {% elif accessory.is_low_stock %}style="color:#ffd48a"{% endif %}>
        {{ accessory.stock_qty }}
      </div>
      <div class="text-xs" style="color:var(--muted)">adet</div>
    </div>
    <div class="text-right">
      <div class="text-sm font-semibold gradient-text">{{ accessory.price|tl }}</div>
      {% if perms.stock.view_money %}
      <div class="text-xs" style="color:var(--muted)">Alış {{ accessory.cost|tl }}</div>
      {% endif %}
    </div>
    <a href="{% url 'stock:accessory_detail' pk=accessory.pk %}" class="btn btn-ghost btn-sm">Aç</a>
  </div>
</div>
