<div id="contact-search" class="space-y-2">
  {% for contact in contacts %}
  <form hx-post="{% url 'stock:cart_customer' %}" hx-target="#cart" hx-swap="outerHTML"
        class="flex items-center justify-between gap-2 glass rounded-xl px-3 py-2">
    <input type="hidden" name="customer" value="{{ contact.pk }}">
    <div class="min-w-0">
      <div class="font-semibold text-sm truncate">{{ contact.full_name }}</div>
      <div class="text-xs" style="color:var(--muted)">
        {{ contact.phone }}{% if contact.company %} · {{ contact.company }}{% endif %}
      </div>
    </div>
    <button class="btn btn-ghost btn-sm shrink-0">Seç</button>
  </form>
  {% endfor %}
  {% if q and not contacts %}
  <p class="text-sm text-center py-2" style="color:var(--muted)">
    "{{ q }}" için cari bulunamadı.
  </p>
  {% endif %}
</div>
