{% load stock_extras %}
<div id="contact-results" class="space-y-3">
  {% for contact in page %}
  <a href="{% url 'stock:contact_detail' pk=contact.pk %}"
     class="card card-hover p-4 flex items-center justify-between gap-3 block">
    <div class="min-w-0">
      <div class="font-semibold truncate">{{ contact.full_name }}</div>
      <div class="text-xs flex flex-wrap gap-x-3 mt-1" style="color:var(--muted)">
        {% if contact.phone %}<span>{{ contact.phone }}</span>{% endif %}
        {% if contact.company %}<span>{{ contact.company }}</span>{% endif %}
        <span>{{ contact.role_label }}</span>
      </div>
    </div>
    <span class="btn btn-ghost btn-sm shrink-0">Aç</span>
  </a>
  {% empty %}
  <div class="card p-12 text-center">
    <div class="text-4xl mb-3">👥</div>
    <p class="font-semibold">Cari kaydı yok</p>
  </div>
  {% endfor %}

  {% if page.has_next %}
  <button class="btn btn-ghost btn-block"
          hx-get="{% url 'stock:contact_list' %}?{{ qs }}&sayfa={{ page.next_page_number }}"
          hx-target="#contact-results" hx-swap="outerHTML" hx-push-url="true">
    Daha Fazla Yükle ({{ page.number }}/{{ page.paginator.num_pages }} · {{ total }} kayıt)
  </button>
  {% endif %}
</div>
