{% extends "stock/base_stock.html" %}
{% load stock_extras %}
{% block page_title %}Giderler{% endblock %}

{% block content %}
{% include "stock/partials/list_header.html" %}

<div class="card p-5 mb-5">
  <div class="text-xs" style="color:var(--muted)">Seçili dönem toplamı</div>
  <div class="text-3xl font-display font-extrabold gradient-text mt-1">{{ amount_total|tl }}</div>
</div>

<div id="expense-filters" class="glass rounded-2xl p-4 mb-5" x-data="{ kapsam: '{{ kapsam|escapejs }}' }">
  <div class="flex flex-wrap items-center gap-3 justify-between">
    <select name="tur" class="select" style="width:auto"
            hx-get="{% url 'stock:expense_list' %}" hx-include="#expense-filters"
            hx-target="#expense-results" hx-swap="outerHTML" hx-push-url="true">
      <option value="">Tüm türler</option>
      {% for value, label in kinds %}
      <option value="{{ value }}" {% if tur == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    <div class="flex flex-wrap items-center gap-2">
      <label class="filter-chip cursor-pointer" :class="kapsam === '' ? 'active' : ''" @click="kapsam=''">
        <input type="radio" name="kapsam" value="" class="sr-only" {% if not kapsam %}checked{% endif %}
               hx-get="{% url 'stock:expense_list' %}" hx-include="#expense-filters"
               hx-target="#expense-results" hx-swap="outerHTML" hx-push-url="true"> Tümü
      </label>
      <label class="filter-chip cursor-pointer" :class="kapsam === 'cihaz' ? 'active' : ''" @click="kapsam='cihaz'">
        <input type="radio" name="kapsam" value="cihaz" class="sr-only" {% if kapsam == 'cihaz' %}checked{% endif %}
               hx-get="{% url 'stock:expense_list' %}" hx-include="#expense-filters"
               hx-target="#expense-results" hx-swap="outerHTML" hx-push-url="true"> Cihaz gideri
      </label>
      <label class="filter-chip cursor-pointer" :class="kapsam === 'genel' ? 'active' : ''" @click="kapsam='genel'">
        <input type="radio" name="kapsam" value="genel" class="sr-only" {% if kapsam == 'genel' %}checked{% endif %}
               hx-get="{% url 'stock:expense_list' %}" hx-include="#expense-filters"
               hx-target="#expense-results" hx-swap="outerHTML" hx-push-url="true"> Genel gider
      </label>
    </div>
  </div>
</div>

{% include "stock/partials/expense_rows.html" %}
{% endblock %}
