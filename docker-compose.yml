services:
  web:
    build:
      context: .
    container_name: bayco-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8090
             --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    volumes:
      # db.sqlite3, media/ ve staticfiles/ host'ta kalsın (rebuild'de kaybolmasın,
      # nginx alias ile diskten okuyabilsin).
      - .:/app
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
